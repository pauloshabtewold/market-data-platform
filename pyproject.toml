[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-platform"
version = "0.1.0"
description = "Minute-bar market data ingestion, analytical queries, and a paginated read API over partitioned PostgreSQL"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paulos Habtewold" }]
dependencies = [
    "psycopg[binary,pool]>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.0",
]

[tool.setuptools]
py-modules = ["config"]
packages = ["ingest", "api", "db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
