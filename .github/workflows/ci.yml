name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every interpreter reports its own verdict. With the default fail-fast, the first job to
      # fail cancels the others and they report `cancelled` rather than pass or fail -- and this
      # project's convention is to read this workflow by job name.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    env:
      ALPACA_KEY_ID: placeholder-key-id
      ALPACA_SECRET_KEY: placeholder-secret-key
      ALPACA_TRADING_HOST: https://paper-api.alpaca.markets
      INGEST_START: "2020-08-01"
      INGEST_END: "2026-06-30"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest
